[package]
name = "king_tongue_sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The Core Sim. ADR-0001: glam and nothing else by default. No renderer, no
# window, no engine types. ADR-0007: integration is Velocity Verlet.
#
# `serde` is optional and OFF by default, so the default dependency set stays
# provably glam-only and `scripts/check-sim-deps.sh` can assert it. The Shell
# turns it on to parse level data into these types.
[dependencies]
glam = { workspace = true }
serde = { workspace = true, optional = true }
ron = { workspace = true, optional = true }

[features]
default = []
# Level parsing. ADR-0001 permits a parser behind a feature flag; keeping it
# off by default is what lets scripts/check-sim-deps.sh assert the boundary.
serde = ["dep:serde", "dep:ron", "glam/serde"]
# ASCII level sketches for readable headless tests. Never enabled in a build
# that ships.
test-util = []
