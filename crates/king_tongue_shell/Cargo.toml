[package]
name = "king_tongue_shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The Shell. Owns no game state (ADR-0001). Renders Core Sim output and turns
# touches into Gesture intents.
#
# Both library types are required, and this is not stylistic:
#   cdylib -> the .so that miniquad's QuadNative loads via System.loadLibrary
#             on Android. Without it there is nothing for the JNI layer to open.
#   rlib   -> lets the desktop bin target link against the same code.
[lib]
name = "king_tongue_shell"
crate-type = ["cdylib", "rlib"]

# Desktop entry point, for running and testing without an Android device.
[[bin]]
name = "king-tongue-desktop"
path = "src/main.rs"

[dependencies]
king_tongue_sim = { path = "../king_tongue_sim", features = ["serde"] }
glam = { workspace = true }
macroquad = { workspace = true }
