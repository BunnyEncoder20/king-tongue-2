[workspace]
resolver = "2"
members = ["crates/king_tongue_sim", "crates/king_tongue_shell"]

[workspace.package]
edition = "2021"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

# Shared so the sim and the shell can never disagree on the math layer.
[workspace.dependencies]
glam = "0.30.10"
macroquad = "=0.4.16"
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
